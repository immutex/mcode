name: CI

on:
  push:
    # `master` is the default branch; `main` is listed so a rename does not
    # silently stop CI from running, which is exactly what happened once already.
    branches: [master, main]

    # A bare `branches:` filter excludes tags, so pushing `v0.0.1` started
    # nothing and the release never ran. Tags have to be listed explicitly.
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      full_macos:
        description: 'Run the full suite on macOS (expensive)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CONAN_VERSION: '2.32.0'
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  api-definition:
    name: API definition check
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # The definition file is checked against the same Luau commit the package
      # pins, so a VM bump cannot silently invalidate the API surface.
      - name: Fetch Luau
        run: |
          git clone https://github.com/luau-lang/luau.git "$RUNNER_TEMP/luau"
          git -C "$RUNNER_TEMP/luau" checkout \
            "$(grep -oE '_commit = "[0-9a-f]+"' conan/recipes/luau/conanfile.py | cut -d'"' -f2)"

      - name: Check the API definition
        run: bash tools/api_check/run.sh "$RUNNER_TEMP/luau"

  vm-spike:
    name: VM spike (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
          - name: macOS arm64
            os: macos-14

    steps:
      - uses: actions/checkout@v7

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Run the spike
        run: bash tools/spike/run_posix.sh "$RUNNER_TEMP/mcode-spike"

  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64 (GCC 14, full)
            os: ubuntu-24.04
            preset: linux-gcc
            profile: conan/profiles/linux-gcc
          - name: Windows x64 (MSVC, full)
            os: windows-2022
            preset: windows-msvc
            profile: conan/profiles/windows-msvc
          - name: macOS arm64 (Apple Clang, build + smoke)
            os: macos-14
            preset: macos-clang
            profile: conan/profiles/macos-clang

    steps:
      - uses: actions/checkout@v7

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Conan
        run: |
          python -m pip install --upgrade pip
          python -m pip install "conan==${{ env.CONAN_VERSION }}"
          conan --version

      # `--profile` sets the HOST context only; the BUILD profile still defaults
      # to ~/.conan2/profiles/default, which a fresh runner does not have. Without
      # this, `conan create` fails with "The default build profile ... doesn't
      # exist" on every platform.
      - name: Detect the default Conan profile
        run: conan profile detect --force

      - name: Cache Conan packages
        uses: actions/cache@v6
        with:
          path: ~/.conan2/p
          key: conan-${{ runner.os }}-${{ hashFiles('conanfile.py', 'conan/recipes/**', 'conan/profiles/**') }}
          restore-keys: |
            conan-${{ runner.os }}-

      - name: Build Luau package
        run: conan create conan/recipes/luau --profile ${{ matrix.profile }} --build=missing --version 0.0.0-mcode.c0e346ed

      - name: Install dependencies
        run: conan install . --profile ${{ matrix.profile }} --build=missing

      # The ConPTY screen gate (tests/CMakeLists.txt) is a Python tool with
      # Python dependencies, so it is not covered by `conan install`. Without
      # this the gate is registered and then fails on the missing import, which
      # is the intended failure mode but a confusing one.
      - name: Install the TUI gate dependencies
        if: runner.os == 'Windows'
        run: python -m pip install -r tools/tui_check/requirements.txt

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DMCODE_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build/Release --config Release

      - name: Unit tests
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

      # The bare invocation starts the interactive session, so the self-check
      # lives behind `--smoke`. Stdin is closed so a mistake here fails fast
      # instead of hanging on a prompt.
      - name: Startup smoke test
        shell: bash
        run: |
          executable="build/Release/bin/mcode"
          [ -f "$executable" ] || executable="build/Release/bin/mcode.exe"
          "$executable" --smoke < /dev/null

      # docs/26 E6/E7. Ten deterministic tasks against the fixture repo. No model
      # involved, so a failure is always a real regression rather than sampling
      # noise -- which is exactly why docs/11 prefers deterministic fixtures over
      # small-n suites for a regression gate.
      - name: Deterministic eval suite
        shell: bash
        run: |
          executable="build/Release/bin/mcode"
          [ -f "$executable" ] || executable="build/Release/bin/mcode.exe"
          "$executable" eval --json | tee eval-records.jsonl
          "$executable" eval

      - name: Upload eval records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-records-${{ matrix.name }}
          path: eval-records.jsonl
          if-no-files-found: ignore

      # docs/26 B5. Gates the measurement spine against tools/bench/budgets.toml.
      # Memory metrics are deterministic and gated tightly; timing metrics vary
      # 26-131% run to run, so they are gated against the documented budget with
      # a wide safety factor rather than against the last run (docs/28).
      - name: Benchmark budget gate
        shell: bash
        run: |
          executable="build/Release/tools/bench/mcode_bench"
          [ -f "$executable" ] || executable="build/Release/tools/bench/mcode_bench.exe"
          "$executable" 20 8 20000 | tee bench-output.txt | python3 tools/bench/gate.py

      - name: Upload benchmark output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-output-${{ matrix.name }}
          path: bench-output.txt
          if-no-files-found: ignore

      - name: Platform-specific tests
        run: ctest --preset ${{ matrix.preset }} -L platform --output-on-failure

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.name }}
          path: build/Release/Testing/
          if-no-files-found: ignore

  package:
    name: Package (${{ matrix.name }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            preset: linux-gcc
            profile: conan/profiles/linux-gcc
          - name: windows-x64
            os: windows-2022
            preset: windows-msvc
            profile: conan/profiles/windows-msvc
          - name: macos-arm64
            os: macos-14
            preset: macos-clang
            profile: conan/profiles/macos-clang

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Conan
        run: python -m pip install "conan==${{ env.CONAN_VERSION }}"

      # Same trap as the build job: `--profile` sets the HOST context only, so
      # the BUILD profile still defaults to ~/.conan2/profiles/default, which a
      # fresh runner does not have. The package job was tag-gated and had never
      # run, so it carried this bug from the day it was written: the first tag
      # failed all three platforms with "The default build profile ... doesn't
      # exist" before it reached the build.
      - name: Detect the default Conan profile
        run: conan profile detect --force

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build Luau package
        run: conan create conan/recipes/luau --profile ${{ matrix.profile }} --build=missing --version 0.0.0-mcode.c0e346ed

      - name: Install dependencies
        run: conan install . --profile ${{ matrix.profile }} --build=missing

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build build/Release --config Release

      - name: Strip and sign (macOS)
        if: runner.os == 'macOS'
        run: |
          strip -x build/Release/bin/mcode || true
          codesign --force --sign - build/Release/bin/mcode
          codesign --verify --verbose build/Release/bin/mcode

      - name: Report binary size
        shell: bash
        run: |
          executable="build/Release/bin/mcode"
          [ -f "$executable" ] || executable="build/Release/bin/mcode.exe"
          size=$(stat -c %s "$executable" 2>/dev/null || stat -f %z "$executable")
          echo "binary: $((size / 1024 / 1024)) MiB ($size bytes)"

      # The install scripts predict this name from the tag and the detected
      # platform, so it is a contract: `mcode-<version>-<platform>.<ext>`, with
      # the same three platform tokens the `matrix.name` values carry.
      - name: Package the archive
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="mcode-${version}-${{ matrix.name }}"
          binary="build/Release/bin/mcode"
          [ -f "$binary" ] || binary="build/Release/bin/mcode.exe"

          # Stage everything the archive should contain, then archive the
          # directory. Two `-C` flags in one tar invocation is a trap: the
          # relative paths silently produce a tarball with the wrong layout.
          #
          # LICENSE is required, not optional: Apache-2.0 section 4(a) obliges
          # anyone redistributing the work to ship a copy of the License, and a
          # release archive is a redistribution. THIRD-PARTY-NOTICES carries the
          # attribution for what mcode embeds.
          rm -rf stage dist
          mkdir -p stage dist
          cp README.md LICENSE THIRD-PARTY-NOTICES.md stage/

          if [ "${{ runner.os }}" = "Windows" ]; then
            # `mcode.exe` inside, because that is the name the installer looks for
            cp "$binary" stage/mcode.exe
            # a zip, because Windows unpacks it without needing a tar binary
            ( cd stage && 7z a -tzip "../dist/${name}.zip" . > /dev/null )
          else
            # `mcode` inside, because that is the name the installer looks for
            cp "$binary" stage/mcode
            chmod +x stage/mcode
            tar -czf "dist/${name}.tar.gz" -C stage .
          fi

          rm -rf stage
          ls -la dist/

      - name: Upload the archive
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Collect the archives
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      # One checksum file over every asset. The installers fetch it and verify
      # the download before it is ever executed, so a tampered mirror or a
      # truncated transfer fails closed rather than installing.
      #
      # Bare filenames, no `./` prefix: the installers match the entry by
      # `grep " <name>$"`, and `sha256sum ./*` writes `./<name>`, which that
      # pattern does not match. That mismatch would have looked like a missing
      # entry on every install.
      - name: Write SHA256SUMS
        run: |
          cd dist
          : > SHA256SUMS
          for archive in *.tar.gz *.zip; do
            [ -f "$archive" ] || continue
            sha256sum "$archive" >> SHA256SUMS
          done
          ls -la
          cat SHA256SUMS
          [ -s SHA256SUMS ] || { echo "no archives to checksum"; exit 1; }

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "mcode $GITHUB_REF_NAME" \
            --generate-notes \
            dist/*.tar.gz dist/*.zip dist/SHA256SUMS
