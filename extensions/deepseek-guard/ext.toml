name = "deepseek-guard"
version = "0.1.0"
api_version = 1
description = "Watch for the failure modes DeepSeek V4 Flash is documented to have, and say so when they happen"

# No permissions. This extension only observes events and reports; it reads no
# files, makes no network calls, and spawns nothing. A guard that needed
# capabilities would be a guard whose own attack surface had to be audited.
permissions = []
