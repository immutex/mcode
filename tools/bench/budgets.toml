# Benchmark budgets and gate kinds.
#
# Two kinds, because the two families of metric behave differently (docs/28):
#
#   ceiling   value must be <= limit. A budget from docs/01 or docs/26.
#             Used where the number is a hard design constraint.
#
#   baseline  value must be within `tolerance` of `expected`. A regression gate.
#             Only usable on metrics that are deterministic across runs.
#
# Measured variance on a quiet Windows x64 machine, 5 consecutive runs:
#   memory metrics (allocator counters)  0.0%   -- exactly deterministic
#   timing metrics                      26-131%  -- unusable as a tight gate
#
# So memory gets baseline gates at 5%, and timing gets ceiling gates against
# the documented budget with a wide safety factor. A 10% regression gate on a
# timing metric would fail on noise, which is worse than no gate: it trains
# people to ignore the gate.

[memory]
# Deterministic. Gate these tightly.
ext_bytes_mean = { kind = "baseline", expected = 352736, tolerance = 0.05 }
ext_bytes_peak = { kind = "baseline", expected = 385456, tolerance = 0.05 }
bare_vm_bytes = { kind = "baseline", expected = 320016, tolerance = 0.05 }

[budgets]
# The documented budgets, enforced as ceilings.
ext_bytes_mean = { kind = "ceiling", limit = 524288 }
ext_bytes_peak = { kind = "ceiling", limit = 524288 }

[timing]
# Not deterministic. Gate against the budget, not against the last run.
#
# load_per_ext_us: docs/01 allows <=1 ms for the FIRST extension. The marginal
# cost is what this measures, and it was gated at 250 us -- 2.3x the ~110 us
# measured on a quiet machine, which a shared CI runner exceeded at 341 us. The
# gate is now the documented 1 ms budget: a 9x margin over the local measurement,
# which still catches an order-of-magnitude regression and no longer fails on
# runner noise. docs/28 records that timing metrics vary 26-131%, so a gate tight
# enough to be interesting is a gate that fails on load.
load_per_ext_us = { kind = "ceiling", limit = 1000 }

# 20 extensions must load inside docs/26's 10 ms budget.
load_total_ms = { kind = "ceiling", limit = 10 }

# docs/26 allows 0.5 ms per vetoable event. Gating at 50 handlers against the
# full budget would pass even a 100x regression, so this gates at 10% of it.
dispatch_handlers_50_us_per_call = { kind = "ceiling", limit = 50 }
dispatch_handlers_10_us_per_call = { kind = "ceiling", limit = 10 }

# D4. The escape hatch costs ~1.9x the declarative path (docs/28); this gate
# catches the ratio moving, not the absolute number, so it is set well above the
# measured ~0.5 us. Both metrics are emitted by the same run, so a change in
# either shows up as a ratio shift.
provider_declarative_us_per_event = { kind = "ceiling", limit = 2 }
provider_escape_hatch_us_per_event = { kind = "ceiling", limit = 5 }

# Both paths must produce exactly ONE event per iteration. A hatch that silently
# drops events is the failure this catches -- it would otherwise show up as a
# suspiciously fast escape hatch.
#
# The gate is on the RATIO, not the raw count: the iteration count is a
# command-line argument, so a fixed expected count encodes the invocation rather
# than the behaviour. It was recorded at 50000 and CI runs 20000, which failed
# the gate on two platforms for no reason. The ratio is invocation-independent,
# so it is exact.
provider_declarative_events_per_iteration = { kind = "baseline", expected = 1.0, tolerance = 0 }
provider_escape_hatch_events_per_iteration = { kind = "baseline", expected = 1.0, tolerance = 0 }
